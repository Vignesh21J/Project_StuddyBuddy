<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <title>403 Forbidden - Access Denied</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px; 
        }
        .error-code { 
            font-size: 100px; 
            font-weight: bold; 
            color: #ff0000; 
        }
        .message { 
            font-size: 24px; 
        }
        .solution { 
            font-size: 16px; color: #555; 
        }
    </style>
</head>
<body>
    <div class="error-code">403</div>
    <div class="message">Oops, you don't have permission to access this page.</div>
    <div class="solution">
        <p>The server understood the request but refused to authorize it.</p>
        <p>If you believe this is an error, please contact the website administrator.</p>
    </div>
    <a href="{% url 'home' %}">Go to Homepage</a>
</body>
</html>
