<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <title>500 - Server Error</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #f9fafb;
            color: #333;
        }

        .error-code {
            font-size: 96px;
            font-weight: 800;
            color: #e63946;
            margin-bottom: 10px;
        }

        .message {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .solution {
            font-size: 16px;
            color: #555;
            max-width: 520px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            text-decoration: none;
            background-color: #2563eb;
            color: #fff;
            border-radius: 6px;
            font-weight: 500;
        }

        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="error-code">500</div>

    <div class="message">
        Something went wrong
    </div>

    <div class="solution">
        <p>
            Oops! An unexpected error occurred on our server.
        </p>
        <p>
            This is not your fault. I has been notified and working to fix the issue as soon as possible.
        </p>
        <p>
            Please try refreshing the page or come back later.
        </p>
    </div>

    <a href="{% url 'home' %}">Go to Homepage</a>

</body>
</html>
